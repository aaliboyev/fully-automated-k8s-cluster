---
# =============================================================================
# Install Longhorn distributed storage on Kubernetes cluster
# =============================================================================
- name: Install Longhorn
  hosts: control_plane[0]
  become: yes
  gather_facts: no

  tasks:
    # -------------------------------------------------------------------------
    # Install Helm
    # -------------------------------------------------------------------------
    - name: Check if Helm is installed
      command: which helm
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Install Helm
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      when: helm_check.rc != 0

    # -------------------------------------------------------------------------
    # Install longhornctl CLI
    # -------------------------------------------------------------------------
    - name: Check if longhornctl is installed
      command: which longhornctl
      register: longhornctl_check
      failed_when: false
      changed_when: false

    - name: Determine architecture
      command: uname -m
      register: arch
      changed_when: false

    - name: Set architecture variable
      set_fact:
        longhorn_arch: "{{ 'arm64' if arch.stdout == 'aarch64' else 'amd64' }}"

    - name: Download longhornctl
      get_url:
        url: "https://github.com/longhorn/cli/releases/download/{{ longhorn_cli_version }}/longhornctl-linux-{{ longhorn_arch }}"
        dest: /tmp/longhornctl
        mode: '0755'
      when: longhornctl_check.rc != 0

    - name: Install longhornctl
      command: install /tmp/longhornctl /usr/local/bin/longhornctl
      when: longhornctl_check.rc != 0

    # -------------------------------------------------------------------------
    # Create namespace and run preflight
    # -------------------------------------------------------------------------
    - name: Check if Longhorn namespace exists
      command: kubectl get namespace longhorn-system
      register: longhorn_ns_check
      failed_when: false
      changed_when: false

    - name: Create Longhorn namespace
      command: kubectl create namespace longhorn-system
      when: longhorn_ns_check.rc != 0

    - name: Run Longhorn preflight installer
      command: longhornctl install preflight --kubeconfig=/root/.kube/config
      register: preflight_install

    - name: Display preflight installer results
      debug:
        var: preflight_install.stdout_lines

    - name: Check preflight results
      command: longhornctl check preflight --kubeconfig=/root/.kube/config
      register: preflight_check
      changed_when: false

    - name: Display preflight check results
      debug:
        var: preflight_check.stdout_lines

    # -------------------------------------------------------------------------
    # Install Longhorn with Helm
    # -------------------------------------------------------------------------
    - name: Add Longhorn Helm repository
      command: helm repo add longhorn https://charts.longhorn.io
      register: helm_repo_add
      changed_when: "'already exists' not in helm_repo_add.stdout"
      failed_when: false

    - name: Update Helm repositories
      command: helm repo update
      changed_when: false

    - name: Check if Longhorn is already installed
      command: helm list -n longhorn-system -q
      register: helm_list
      changed_when: false

    - name: Copy Longhorn values file
      copy:
        src: "{{ playbook_dir }}/../../components/longhorn/values.yaml"
        dest: /tmp/longhorn-values.yaml
        mode: '0644'
      when: "'longhorn' not in helm_list.stdout"

    - name: Install Longhorn via Helm
      command: >
        helm install longhorn longhorn/longhorn
        --namespace longhorn-system
        --version {{ longhorn_chart_version }}
        --values /tmp/longhorn-values.yaml
      when: "'longhorn' not in helm_list.stdout"

    - name: Wait for Longhorn driver deployer to be ready
      command: kubectl -n longhorn-system rollout status deployment/longhorn-driver-deployer --timeout=10m
      changed_when: false

    - name: Wait for Longhorn manager to be ready
      command: kubectl -n longhorn-system rollout status deployment/longhorn-manager --timeout=10m
      changed_when: false

    - name: Wait for Longhorn UI to be ready
      command: kubectl -n longhorn-system rollout status deployment/longhorn-ui --timeout=5m
      changed_when: false

    - name: Display Longhorn status
      command: kubectl -n longhorn-system get pods
      register: longhorn_pods
      changed_when: false

    - name: Show Longhorn pods status
      debug:
        var: longhorn_pods.stdout_lines

    - name: Display storage classes
      command: kubectl get sc
      register: storage_classes
      changed_when: false

    - name: Show storage classes
      debug:
        var: storage_classes.stdout_lines

    - name: Display access info
      debug:
        msg: |
          Longhorn installed successfully!
          
          Storage class 'longhorn' is now available (set as default).
          
          To access Longhorn UI locally:
          kubectl port-forward -n longhorn-system svc/longhorn-frontend 8080:80
          
          Then open: http://localhost:8080
