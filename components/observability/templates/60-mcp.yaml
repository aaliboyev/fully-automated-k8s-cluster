# MCP servers over the metrics and logs stores, so an agent can query them
# directly. Exposed on the private gateway by 31-mcp-route.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-victoriametrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-mcp
      targetRevision: 0.4.0
      helm:
        valueFiles:
          - $values/components/observability/values/mcp-victoriametrics.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-victorialogs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-logs-mcp
      targetRevision: 0.2.0
      helm:
        valueFiles:
          - $values/components/observability/values/mcp-victorialogs.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
