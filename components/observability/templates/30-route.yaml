apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vm-grafana-route
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.grafana.domain }}
spec:
  hostnames:
    - {{ .Values.grafana.domain }}
  parentRefs:
    - name: private
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vm-stack-grafana
          port: 80
