# One ConfigMap per dashboards/<folder>/<uid>.json, generated by dashboards/src.
# The sidecar files each one under the Grafana folder named in grafana_folder.
# The sidecar watches the observability namespace, so these carry an explicit
# metadata.namespace even though this Application's destination is argocd.
{{- range $path, $_ := .Files.Glob "dashboards/*/*.json" }}
{{- $folder := base (dir $path) }}
{{- $name := base $path | trimSuffix ".json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ $folder }}-{{ $name }}
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    grafana_folder: {{ title $folder }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
data:
  {{ $name }}.json: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
