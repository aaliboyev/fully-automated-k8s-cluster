# Longhorn Storage Configuration
# https://longhorn.io/docs/

# Set Longhorn as the default storage class
persistence:
  defaultClass: true
  defaultClassReplicaCount: 3

# Resource management
defaultSettings:
  # Guarantee 10% minimum free disk space
  storageMinimalAvailablePercentage: 10
  
  # Use least-used node scheduling
  replicaAutoBalance: "least-effort"
  
  # Data locality for faster access
  defaultDataLocality: "best-effort"
  
  # Backup settings
  backupTarget: ""
  backupTargetCredentialSecret: ""
  
  # System management
  orphanAutoDeletion: true
  
# Ingress for UI (disabled by default)
ingress:
  enabled: false

# Service type for UI
service:
  ui:
    type: ClusterIP
