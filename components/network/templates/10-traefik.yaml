apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-traefik-private
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 37.4.0
      helm:
        valueFiles:
          - $values/components/network/values/traefik-private.yaml
        values: |
          service:
            annotations:
              external-dns.alpha.kubernetes.io/hostname: {{ .Values.traefik.private.hostname }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: network
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-traefik-public
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 37.4.0
      helm:
        valueFiles:
          - $values/components/network/values/traefik-public.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: network
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
