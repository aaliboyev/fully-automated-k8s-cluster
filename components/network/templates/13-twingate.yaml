apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-twingate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://twingate.github.io/helm-charts
      chart: connector
      targetRevision: 0.1.32
      helm:
        valueFiles:
          - $values/components/network/values/twingate.yaml
        values: |
          connector:
            network: {{ .Values.twingate.network }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: network
  syncPolicy:
    automated:
      prune: true
      selfHeal: true