apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: network
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cert-manager.io/cluster-issuer: letsencrypt-dns
    external-dns.alpha.kubernetes.io/target: {{ .Values.traefik.private.hostname }}
spec:
  gatewayClassName: private
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      hostname: {{ .Values.gatewayHostname | quote }}
      allowedRoutes:
        namespaces:
          from: All

    - name: websecure
      protocol: HTTPS
      port: 8443
      hostname: {{ .Values.gatewayHostname | quote }}
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            name: public-wildcard-tls
            kind: Secret

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: network
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  gatewayClassName: public          # must match Traefik's GatewayClass
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gatewayHostname | quote }}    # HTTP, no TLS, but host still useful for routing
      allowedRoutes:
        namespaces:
          from: All

    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gatewayHostname | quote }}
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            name: public-wildcard-tls  # Secret name *and* Certificate name
            kind: Secret               # must be Secret, same namespace as Gateway
