apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: network
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cert-manager.io/cluster-issuer: letsencrypt-dns
    external-dns.alpha.kubernetes.io/target: {{ .Values.traefik.private.hostname }}
spec:
  gatewayClassName: private
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      hostname: {{ .Values.gatewayHostname | quote }}
      allowedRoutes:
        namespaces:
          from: All

    - name: websecure
      protocol: HTTPS
      port: 8443
      hostname: {{ .Values.gatewayHostname | quote }}
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            name: public-wildcard-tls
            kind: Secret

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: network
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cert-manager.io/cluster-issuer: letsencrypt-dns
    external-dns.alpha.kubernetes.io/target: {{ .Values.publicEdgeHostname }}
spec:
  gatewayClassName: public-v2
  listeners:
    # Every host on port 80, routed only to https-redirect below: app routes
    # from other namespaces can't attach, so nothing is served over plain HTTP.
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gatewayHostname | quote }}
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            name: public-wildcard-tls  # Secret name *and* Certificate name
            kind: Secret               # must be Secret, same namespace as Gateway

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: network
spec:
  parentRefs:
    - {name: public, sectionName: web}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
