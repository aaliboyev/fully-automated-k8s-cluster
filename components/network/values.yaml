# Network stack configuration
# These values are used across all network component templates

# Base domain for all services
domain: example.com
gatewayHostname: "*.example.com"
argocdHostname: argocd.example.com

# Email for Let's Encrypt certificate notifications
email: admin@example.com

# External DNS configuration
externalDns:
  txtOwnerId: example-infra

traefik:
  private:
    hostname: internal.example.com

# Public Gateways point DNS here: one A record per HAProxy edge node.
publicEdgeHostname: dns.example.com

# Git repository URL for ArgoCD applications
repoURL: git@github.com:your-org/your-infra-repo.git

# Child application Helm values are in the values/ directory
