provider:
  name: cloudflare
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token
policy: sync
logLevel: debug
dnsPolicy: ClusterFirstWithHostNet
sources:
  - service
  - ingress
  - gateway-httproute
txtPrefix: "_external-dns."
# 0.22 changed the default annotation prefix; every manifest here uses this one.
annotationPrefix: external-dns.alpha.kubernetes.io/
