ingressClass:
  enabled: true
  isDefaultClass: true
  name: "private"
gatewayClass:
  enabled: true
  name: "private"
  labels:
    gateway-class-type: private
gateway:
  enabled: false
service:
  annotations:
    external-dns.alpha.kubernetes.io/target: 10.111.111.111
  spec:
    type: ClusterIP
    clusterIP: 10.111.111.111
providers:
  # Ingress annotations must reference CRD middlewares as `namespace_name@kubernetescrd`.
  kubernetesCRD:
    safeNaming: true
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true
    labelSelector: "gateway-class-type=private"
ports:
  # Drop headers like Remote_User: backends read them as the Remote-User that
  # ForwardAuth sets, so a client could spoof the authenticated user.
  traefik:
    http: &aliasHeaders
      aliasHeadersStrategy: delete
  web:
    port: 8000
    http: *aliasHeaders
  websecure:
    port: 8443
    http: *aliasHeaders
  metrics:
    http: *aliasHeaders
