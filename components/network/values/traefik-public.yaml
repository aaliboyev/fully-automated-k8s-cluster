deployment:
  kind: DaemonSet
securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0
ingressClass:
  enabled: true
  isDefaultClass: false
  name: "public"
gatewayClass:
  enabled: true
  name: "public"
  labels:
    gateway-class-type: public
gateway:
  enabled: false
service:
  enabled: true
  single: true
  type: ClusterIP
providers:
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true
    labelselector: "gateway-class-type=public"
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
ports:
  web:
    port: 80
    hostPort: 80
  websecure:
    port: 443
    hostPort: 443
  metrics:
    port: 9101
updateStrategy:
  rollingUpdate:
    maxUnavailable: 3
    maxSurge: 0
