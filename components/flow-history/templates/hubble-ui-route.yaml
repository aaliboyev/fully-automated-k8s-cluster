# Hubble UI has no login of its own; the private gateway is reachable only over
# Tailscale, which is the access control here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.hubbleUI.hostname }}
spec:
  hostnames:
    - {{ .Values.hubbleUI.hostname }}
  parentRefs:
    - name: private
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubble-ui
          port: 80
