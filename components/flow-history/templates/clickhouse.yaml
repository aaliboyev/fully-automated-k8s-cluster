{{- $ch := .Values.clickhouse }}
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - {name: http, port: 8123, targetPort: http}
    - {name: native, port: 9000, targetPort: native}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: flow-history
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/clickhouse-config.yaml") . | sha256sum }}
    spec:
      # The local-path volume is created on the first node the pod lands on.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [{{ $ch.node }}]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 60
      containers:
        - name: clickhouse
          image: {{ $ch.image }}
          env:
            # Users come from users.xml; the entrypoint must not rewrite them.
            - {name: CLICKHOUSE_SKIP_USER_SETUP, value: "1"}
            - {name: CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS, value: "1"}
            - name: CLICKHOUSE_VECTOR_PASSWORD
              valueFrom:
                secretKeyRef: {name: flow-history-clickhouse, key: vector-password}
            - name: CLICKHOUSE_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef: {name: flow-history-clickhouse, key: grafana-password}
          envFrom:
            - secretRef:
                name: flow-history-s3
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          # The entrypoint starts the server once for flows.sql before the real start.
          startupProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $ch.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
            - {name: config, mountPath: /etc/clickhouse-server/config.d/server.xml, subPath: server.xml}
            - {name: config, mountPath: /etc/clickhouse-server/config.d/system-logs.xml, subPath: system-logs.xml}
            - {name: config, mountPath: /etc/clickhouse-server/config.d/storage.xml, subPath: storage.xml}
            - {name: config, mountPath: /etc/clickhouse-server/users.d/users.xml, subPath: users.xml}
            - {name: config, mountPath: /docker-entrypoint-initdb.d/flows.sql, subPath: flows.sql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $ch.storageClass }}
        resources:
          requests:
            storage: {{ $ch.size }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: vector}}
      ports: [{port: 8123, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports: [{port: 9000, protocol: TCP}]
