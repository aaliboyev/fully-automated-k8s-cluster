{{- if and .Values.registry.enabled (not .Values.registry.auth.existingSecret) }}
{{- if and .Values.registry.auth.username .Values.registry.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buildkit.fullname" . }}-registry
  labels:
    {{- include "buildkit.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.registry.url .Values.registry.auth.username .Values.registry.auth.password (printf "%s:%s" .Values.registry.auth.username .Values.registry.auth.password | b64enc) | b64enc }}
{{- end }}
{{- end }}
---
{{- if and .Values.registry.enabled .Values.registry.ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buildkit.fullname" . }}-registry-ca
  labels:
    {{- include "buildkit.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ .Values.registry.ca | b64enc }}
{{- end }}
