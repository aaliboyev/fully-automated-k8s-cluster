{{- range .Values.gatewayClasses }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "hug.labels" $ | nindent 4 }}
spec:
  controllerName: {{ $.Values.controllerName }}
  {{- with .parametersRef }}
  parametersRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
